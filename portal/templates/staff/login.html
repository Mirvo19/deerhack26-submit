{% extends "base.html" %}

{% block title %}staff access{% endblock %}

{% block body %}
  <div class="wrap" style="padding:60px var(--dh-margin);max-width:560px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;min-height:70vh">
    <h1 class="section-title" style="font-family:var(--dh-display);font-weight:700;font-size:34px;text-align:center" data-entrance>staff access</h1>
    <form method="post" class="panel" data-reveal>
      <p class="pixel-label">restricted // staff only</p>
      <input type="hidden" name="next" value="{{ nxt }}">
      <label class="f">email</label>
      <input type="email" name="email" required autocomplete="username">
      <label class="f">password</label>
      <input type="password" name="password" required autocomplete="current-password">
      <div class="btnrow">
        <button class="btn dark" type="submit">log in →</button>
      </div>
    </form>
  </div>
{% endblock %}
